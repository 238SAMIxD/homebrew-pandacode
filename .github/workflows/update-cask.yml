name: Update cask from PandaCode release

on:
  repository_dispatch:
    types: [pandacode-release]

permissions:
  contents: write

concurrency:
  group: update-pandacode-cask
  cancel-in-progress: false

jobs:
  update:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@848c272c7bfe984a197bd4d16383f4c106ec61e6 # 2026.09.21.1
        with:
          core: false
          cask: false

      - name: Update version and checksums
        env:
          RELEASE_VERSION: ${{ github.event.client_payload.version }}
        run: python3 scripts/update-cask.py "$RELEASE_VERSION"

      - name: Check Ruby style
        run: brew style --cask "$(brew --repository "$GITHUB_REPOSITORY_OWNER/pandacode")/Casks/pandacode.rb"

      - name: Commit and push cask update
        env:
          RELEASE_VERSION: ${{ github.event.client_payload.version }}
        run: |
          if git diff --quiet -- Casks/pandacode.rb; then
            echo "Cask is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/pandacode.rb
          git commit -m "Update PandaCode to $RELEASE_VERSION"
          git push origin HEAD:main

      - name: Run tap checks for the updated cask
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run tests.yml --repo "$GITHUB_REPOSITORY" --ref main
